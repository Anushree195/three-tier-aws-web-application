<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  <style>
    .title{font:700 30px Arial,sans-serif;fill:#0f172a}
    .sub{font:16px Arial,sans-serif;fill:#334155}
    .h{font:700 20px Arial,sans-serif;fill:#0f172a}
    .t{font:16px Arial,sans-serif;fill:#0f172a}
    .s{font:14px Arial,sans-serif;fill:#334155}
    .box{stroke-width:2;rx:14}
    .arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .dashed{stroke-dasharray:8 6}
  </style>
</defs>
<rect width="1400" height="1120" fill="#f8fafc"/>
<text x="48" y="52" class="title">Three-Tier Web Application on AWS</text>
<text x="48" y="82" class="sub">Logical architecture • Region: ap-south-1 (Mumbai) • HTTP 80 / MySQL 3306</text>
<rect x="35" y="110" width="1330" height="960" rx="20" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
<rect x="55" y="130" width="1290" height="55" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
<text x="75" y="164" class="h">Amazon VPC — three-tier-vpc</text>
<text x="1170" y="164" class="s">Project resources</text>

<!-- users and public ALB -->
<rect x="485" y="205" width="430" height="55" class="box" fill="#f1f5f9" stroke="#64748b"/>
<text x="700" y="239" text-anchor="middle" class="h">Users / Internet</text>
<path d="M700 260 V285" class="arrow"/>
<text x="718" y="278" class="s">HTTP :80</text>
<rect x="405" y="290" width="590" height="82" class="box" fill="#ede9fe" stroke="#7c3aed"/>
<text x="700" y="321" text-anchor="middle" class="h">Public Application Load Balancer</text>
<text x="700" y="347" text-anchor="middle" class="t">three-tier-backend-alb • Internet-facing</text>
<text x="700" y="365" text-anchor="middle" class="s">Listener :80 → web-target-group</text>

<!-- web tier -->
<rect x="70" y="395" width="1260" height="225" class="box" fill="#eff6ff" stroke="#3b82f6"/>
<text x="95" y="427" class="h">Presentation / Web tier — public subnets</text>
<text x="95" y="451" class="s">ASG: three-tier-web-asg • Security Group: web-sg</text>
<rect x="105" y="470" width="560" height="125" class="box" fill="#ffffff" stroke="#93c5fd"/>
<text x="385" y="495" text-anchor="middle" class="t">Public subnet — AZ 1</text>
<rect x="235" y="510" width="300" height="65" class="box" fill="#ffedd5" stroke="#f97316"/>
<text x="385" y="536" text-anchor="middle" class="t">Web EC2 (Apache)</text><text x="385" y="558" text-anchor="middle" class="s">1 instance in AZ 1</text>
<rect x="735" y="470" width="560" height="125" class="box" fill="#ffffff" stroke="#93c5fd"/>
<text x="1015" y="495" text-anchor="middle" class="t">Public subnet — AZ 2</text>
<rect x="865" y="510" width="300" height="65" class="box" fill="#ffedd5" stroke="#f97316"/>
<text x="1015" y="536" text-anchor="middle" class="t">Web EC2 (Apache)</text><text x="1015" y="558" text-anchor="middle" class="s">1 instance in AZ 2</text>
<path d="M700 372 V392" class="arrow"/>
<path d="M700 392 H385 V466" class="arrow"/>
<text x="715" y="389" class="s">Forwards to web-target-group</text>

<!-- internal ALB -->
<path d="M700 620 V649" class="arrow"/>
<text x="720" y="642" class="s">Web tier → internal ALB • HTTP :80</text>
<rect x="405" y="655" width="590" height="78" class="box" fill="#ede9fe" stroke="#7c3aed"/>
<text x="700" y="685" text-anchor="middle" class="h">Internal Application Load Balancer</text>
<text x="700" y="709" text-anchor="middle" class="t">three-tier-internal-alb • Listener :80 → backend-target-group</text>

<!-- backend tier -->
<rect x="70" y="755" width="1260" height="150" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
<text x="95" y="785" class="h">Application / Backend tier — private subnets</text>
<text x="95" y="808" class="s">ASG: three-tier-backend-asg • Security Group: backend-sg</text>
<rect x="120" y="825" width="520" height="58" class="box" fill="#ffedd5" stroke="#f97316"/>
<text x="380" y="849" text-anchor="middle" class="t">Backend EC2 • AZ 1</text><text x="380" y="870" text-anchor="middle" class="s">Private instance</text>
<rect x="760" y="825" width="520" height="58" class="box" fill="#ffedd5" stroke="#f97316"/>
<text x="1020" y="849" text-anchor="middle" class="t">Backend EC2 • AZ 2</text><text x="1020" y="870" text-anchor="middle" class="s">Private instance</text>
<path d="M700 733 V752" class="arrow"/>
<path d="M700 752 H380 V821" class="arrow"/>
<path d="M700 752 H1020 V821" class="arrow"/>

<!-- database -->
<path d="M700 905 V932" class="arrow"/>
<text x="720" y="925" class="s">Configured rule: TCP :3306 from backend-sg</text>
<rect x="250" y="940" width="900" height="95" class="box" fill="#ecfeff" stroke="#0891b2"/>
<text x="700" y="971" text-anchor="middle" class="h">Amazon RDS for MySQL — private database tier</text>
<text x="700" y="997" text-anchor="middle" class="t">three-tier-db • Public access: No • Security Group: db-sg</text>
<text x="700" y="1019" text-anchor="middle" class="s">Note: network rule configured; live MySQL query was not verified</text>

<!-- legend -->
<text x="75" y="1052" class="s">Security boundaries: alb-public-sg → web-sg → alb-backend-sg → backend-sg → db-sg</text>
</svg>